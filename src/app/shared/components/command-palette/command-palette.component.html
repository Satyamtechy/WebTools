@if (open()) {
  <div class="palette-backdrop" (click)="close()"></div>
  <div class="palette">
    <div class="palette-input-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input
        #searchInput
        type="text"
        class="palette-input"
        placeholder="Search icons, loaders, pages..."
        [value]="query()"
        (input)="onInput(searchInput.value)"
        autofocus
      >
      <kbd>ESC</kbd>
    </div>
    <div class="palette-results">
      @for (item of results(); track item.label; let i = $index) {
        <div
          class="palette-item"
          [class.selected]="i === selectedIndex()"
          (click)="selectItem(item)"
          (mouseenter)="selectedIndex.set(i)"
        >
          <div class="item-icon">
            @if (item.type === 'page') {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/></svg>
            }
          </div>
          <div class="item-text">
            <span class="item-label">{{ item.label }}</span>
            @if (item.description) {
              <span class="item-desc">{{ item.description }}</span>
            }
          </div>
          <span class="item-type">{{ item.type }}</span>
        </div>
      }
      @if (results().length === 0) {
        <div class="palette-empty">No results found</div>
      }
    </div>
  </div>
}
